name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  database:
    name: 'Banco: pgTAP e lint'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Só o Postgres sobe: pgTAP e db lint não usam os demais serviços do Supabase local.
      - name: Sobe o Supabase local (só postgres)
        run: >-
          npx supabase start -x
          gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      # Reset aplica migrations e seed de forma determinística antes dos testes.
      - run: npx supabase db reset
      - run: npm run db:test
      - run: npx supabase db lint

      - name: Para o Supabase local
        if: always()
        run: npx supabase stop --no-backup

  integration:
    name: 'Integração: API e Supabase'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # A API precisa de Auth (gotrue), PostgREST e do gateway (kong) além do Postgres.
      - name: Sobe o Supabase local (banco, Auth e API)
        run: >-
          npx supabase start -x
          realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      # Reset aplica migrations e o seed sintético, de que a integração depende.
      - run: npx supabase db reset

      # Chaves do Supabase efêmero deste job (não são segredos de nenhum ambiente real). A service role
      # fica mascarada no log e só existe como variável do processo de teste, sem prefixo VITE_.
      - name: Variáveis do servidor
        run: |
          eval "$(npx supabase status -o env)"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - run: npm run test:integration

      - name: Para o Supabase local
        if: always()
        run: npx supabase stop --no-backup
